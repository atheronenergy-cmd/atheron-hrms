services:
  postgres:
    image: postgres:16-alpine
    container_name: atheron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atheron
      POSTGRES_PASSWORD: atheron_secret
      POSTGRES_DB: atheron_hrms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atheron-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
